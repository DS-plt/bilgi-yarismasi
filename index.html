<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Yarışması</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #6a5af9;
    --bg2: #d66efd;
    --bg3: #3fc4ff;
    --card: rgba(255, 255, 255, 0.95);
    --text: #2b2350;
    --muted: #7a7398;
    --accent: #6a5af9;
    --good: #22c55e;
    --bad: #ef4444;
    --gold: #f8b400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 300% 300%;
    animation: bgMove 16s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 100vh;
  }
  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border-radius: 28px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(40, 20, 100, 0.3);
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    from { transform: scale(0.94) translateY(10px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .hidden { display: none !important; }
  h1 {
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 900;
    text-align: center;
    background: linear-gradient(90deg, var(--bg1), var(--bg2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 26px; }
  label { font-weight: 800; display: block; margin-bottom: 8px; }
  input[type=text] {
    width: 100%;
    font: inherit;
    font-size: 18px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid #e2ddf7;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 22px;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
  .level {
    font: inherit;
    font-weight: 800;
    padding: 14px 8px;
    border-radius: 14px;
    border: 2px solid #e2ddf7;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
  }
  .level small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .level:hover { border-color: var(--accent); transform: translateY(-2px); }
  .level.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .level.selected small { color: #e6e2ff; }
  .btn {
    font: inherit;
    font-weight: 900;
    font-size: 18px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    color: #fff;
    background: linear-gradient(90deg, var(--bg1), var(--bg2));
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(106, 90, 249, 0.35);
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .btn.secondary { background: #efecff; color: var(--accent); box-shadow: none; }
  .records { margin-top: 22px; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
  .records div { flex: 1; text-align: center; background: #f6f4ff; border-radius: 12px; padding: 8px 4px; }
  .records b { display: block; color: var(--text); font-size: 18px; }

  /* Oyun ekranı */
  .greet { font-weight: 800; color: var(--muted); margin-bottom: 14px; text-align: center; }
  .greet span { color: var(--accent); }
  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 800; }
  .pill { background: #f1eeff; border-radius: 999px; padding: 6px 14px; }
  .score { color: var(--accent); }
  .lives { letter-spacing: 2px; font-size: 18px; }
  .timer { height: 12px; background: #eee9ff; border-radius: 999px; overflow: hidden; margin-bottom: 6px; }
  .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--good), #a3e635); border-radius: 999px; }
  .timer-fill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .timer-fill.danger { background: linear-gradient(90deg, var(--bad), #f97316); }
  .time-text { text-align: right; font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 18px; }
  .category { display: inline-block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #fff; background: var(--bg2); border-radius: 8px; padding: 4px 10px; margin-bottom: 10px; }
  .question { font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; margin-bottom: 22px; line-height: 1.35; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answer {
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    text-align: left;
    padding: 16px;
    border-radius: 16px;
    border: 2px solid #e2ddf7;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    gap: 10px;
    align-items: center;
    min-height: 64px;
  }
  .answer .letter {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: #efecff; color: var(--accent);
    font-weight: 900;
  }
  .answer:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(106, 90, 249, 0.18); }
  .answer:disabled { cursor: default; }
  .answer.correct { background: var(--good); border-color: var(--good); color: #fff; animation: bounce 0.4s; }
  .answer.correct .letter { background: #fff; color: var(--good); }
  .answer.wrong { background: var(--bad); border-color: var(--bad); color: #fff; animation: shake 0.4s; }
  .answer.wrong .letter { background: #fff; color: var(--bad); }
  @keyframes bounce { 50% { transform: scale(1.05); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .feedback { text-align: center; font-weight: 800; margin-top: 18px; min-height: 24px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  /* Sonuç ekranı */
  .big-score { text-align: center; font-size: 64px; font-weight: 900; color: var(--accent); line-height: 1; margin: 10px 0 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
  .stat { background: #f6f4ff; border-radius: 14px; padding: 12px 6px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; }
  .stat b { display: block; color: var(--text); font-size: 22px; }
  .new-record { text-align: center; font-weight: 900; color: var(--gold); margin-bottom: 14px; }
  .btn-row { display: grid; gap: 10px; }

  /* Şampiyon popup */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(25, 10, 60, 0.6);
    backdrop-filter: blur(4px);
    display: grid; place-items: center;
    padding: 16px;
    z-index: 10;
    animation: fade 0.3s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .champion {
    background: linear-gradient(135deg, #fff7d6, #ffe08a);
    border: 4px solid var(--gold);
    border-radius: 28px;
    padding: 34px 40px;
    text-align: center;
    box-shadow: 0 0 60px rgba(248, 180, 0, 0.6);
    animation: champ 0.6s cubic-bezier(.2,1.6,.4,1);
    max-width: 380px;
    width: 100%;
  }
  @keyframes champ { from { transform: scale(0.3) rotate(-10deg); opacity: 0; } }
  .champion .trophy { font-size: 72px; animation: float 1.6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .champion h2 { font-size: 38px; font-weight: 900; color: #b45309; letter-spacing: 2px; margin: 8px 0 18px; }
  .champion .btn { background: linear-gradient(90deg, #f59e0b, #f8b400); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4); }
  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 11; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* ---------- Sürprizler ---------- */
  .streak { display: block; text-align: center; font-weight: 900; font-size: 14px; color: #ea580c; min-height: 20px; margin: -6px 0 8px; transition: transform 0.2s; }
  .streak.bump { animation: streakBump 0.45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes streakBump { 40% { transform: scale(1.35); } }
  .card.golden { box-shadow: 0 0 0 4px var(--gold), 0 0 50px rgba(248, 180, 0, 0.75), 0 24px 60px rgba(40, 20, 100, 0.3); animation: goldPulse 1.2s ease-in-out infinite; }
  @keyframes goldPulse { 50% { box-shadow: 0 0 0 4px #ffd54a, 0 0 80px rgba(248, 180, 0, 0.95), 0 24px 60px rgba(40, 20, 100, 0.3); } }
  .card.golden .category { background: linear-gradient(90deg, #f59e0b, var(--gold)); }
  .golden-tag { display: none; margin-left: 6px; font-size: 12px; font-weight: 900; color: #b45309; background: #fff3c4; border-radius: 8px; padding: 4px 10px; vertical-align: top; }
  .card.golden .golden-tag { display: inline-block; animation: float 1.2s ease-in-out infinite; }
  .card.shake { animation: screenShake 0.45s ease; }
  @keyframes screenShake {
    15% { transform: translate(-9px, 3px) rotate(-1deg); } 30% { transform: translate(8px, -4px) rotate(1deg); }
    45% { transform: translate(-6px, 2px); } 60% { transform: translate(5px, -2px); } 80% { transform: translate(-2px, 1px); }
  }
  .spark { position: fixed; width: 9px; height: 9px; border-radius: 3px; z-index: 12; pointer-events: none; animation: sparkFly 0.9s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes sparkFly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.3); opacity: 0; } }
  .toast {
    position: fixed; left: 50%; top: 18px; transform: translate(-50%, -140%);
    background: #2b2350; color: #fff; font-weight: 900; font-size: 16px;
    padding: 12px 20px; border-radius: 999px; z-index: 20; pointer-events: none;
    box-shadow: 0 10px 30px rgba(25, 10, 60, 0.4); transition: transform 0.35s cubic-bezier(.2,1.4,.4,1);
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.gold { background: linear-gradient(90deg, #f59e0b, var(--gold)); color: #3b2300; }
  .sound-btn {
    position: fixed; right: 14px; bottom: 14px; z-index: 15;
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255, 255, 255, 0.9); font-size: 20px; box-shadow: 0 6px 16px rgba(40, 20, 100, 0.3);
  }
  /* Gizli mod: sadece arka plan gökkuşağı gibi döner; kartın renkleri bozulmaz. */
  body.rainbow::before { content: ""; position: fixed; inset: 0; z-index: -1; background: inherit; animation: bgMove 16s ease infinite, hue 4s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  .secret-badge { text-align: center; font-weight: 900; color: #db2777; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) {
    .card.shake, .card.golden, body.rainbow::before { animation: none !important; }
  }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; border-radius: 22px; }
    .answers { grid-template-columns: 1fr; }
    .big-score { font-size: 52px; }
  }
</style>
</head>
<body>

<!-- Giriş ekranı -->
<section id="startScreen" class="card">
  <h1>Bilgi Yarışması</h1>
  <p class="subtitle">Genel kültürünü test et, rekoru kır!</p>

  <label for="nameInput">Adın</label>
  <input id="nameInput" type="text" maxlength="20" placeholder="Adını yaz..." autocomplete="off">

  <label>Zorluk</label>
  <div class="levels">
    <button class="level selected" data-level="kolay">Kolay<small>20 sn</small></button>
    <button class="level" data-level="orta">Orta<small>15 sn</small></button>
    <button class="level" data-level="zor">Zor<small>10 sn</small></button>
  </div>

  <button id="startBtn" class="btn" disabled>Başla</button>
  <p id="secretBadge" class="secret-badge hidden">🌈 Gizli mod açık: bu oyunda +1 can seninle!</p>

  <div class="records">
    <div>Kolay rekor<b id="recKolay">0</b></div>
    <div>Orta rekor<b id="recOrta">0</b></div>
    <div>Zor rekor<b id="recZor">0</b></div>
  </div>
</section>

<!-- Oyun ekranı -->
<section id="gameScreen" class="card hidden">
  <p class="greet">Haydi <span id="greetName"></span>, devam!</p>
  <div class="hud">
    <span class="pill">Soru <span id="qNum">1</span></span>
    <span class="pill lives" id="lives"></span>
    <span class="pill score">Skor: <span id="score">0</span></span>
  </div>
  <div class="timer"><div id="timerFill" class="timer-fill"></div></div>
  <div class="time-text"><span id="timeLeft">20</span> sn</div>
  <p id="streak" class="streak"></p>
  <span id="category" class="category"></span><span class="golden-tag">✨ ALTIN SORU · x3</span>
  <p id="question" class="question"></p>
  <div id="answers" class="answers"></div>
  <p id="feedback" class="feedback"></p>
</section>

<!-- Sonuç ekranı -->
<section id="endScreen" class="card hidden">
  <h1>Oyun Bitti</h1>
  <p class="subtitle">Tebrikler <b id="endName"></b>!</p>
  <div class="big-score" id="finalScore">0</div>
  <p class="subtitle" style="margin-bottom:0">puan</p>
  <p id="newRecord" class="new-record hidden">🎉 Yeni rekor!</p>
  <div class="stats">
    <div class="stat">Doğru<b id="statCorrect">0</b></div>
    <div class="stat">Soru<b id="statTotal">0</b></div>
    <div class="stat">Rekor<b id="statBest">0</b></div>
  </div>
  <div class="btn-row">
    <button id="againBtn" class="btn">Tekrar Oyna</button>
    <button id="menuBtn" class="btn secondary">Ana Menü</button>
  </div>
</section>

<!-- Şampiyon popup -->
<div id="championPopup" class="overlay hidden">
  <div class="champion">
    <div class="trophy">🏆</div>
    <h2>ŞAMPİYON</h2>
    <button id="championBtn" class="btn">Harika!</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button id="soundBtn" class="sound-btn" aria-label="Sesi aç/kapat" title="Sesi aç/kapat">🔊</button>

<script>
// ---------- Soru bankası ----------
// İlk şık her zaman doğru cevaptır; ekranda şıklar karıştırılır.
const QUESTIONS = {

const LEVEL_TIME = { kolay: 20, orta: 15, zor: 10 };
const START_LIVES = 3;
const RECORD_KEY = "bilgiYarismasi.rekorlar";

// ---------- Yardımcılar ----------
const $ = (id) => document.getElementById(id);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// "fikret" kontrolü: büyük/küçük harf ve Türkçe I/İ farkı önemsiz.
function isFikret(name) {
  return name.trim().toLocaleLowerCase("tr-TR").replace(/ı/g, "i") === "fikret";
}

function loadRecords() {
  try {
    const r = JSON.parse(localStorage.getItem(RECORD_KEY));
    if (r && typeof r === "object") return Object.assign({ kolay: 0, orta: 0, zor: 0 }, r);
  } catch (e) {}
  return { kolay: 0, orta: 0, zor: 0 };
}

function saveRecords(r) {
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(r)); } catch (e) {}
}

function showScreen(id) {
  ["startScreen", "gameScreen", "endScreen"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
}

// ---------- Oyun durumu ----------
let state = null;
let level = "kolay";
let timerId = null;

function renderRecords() {
  const r = loadRecords();
  $("recKolay").textContent = r.kolay;
  $("recOrta").textContent = r.orta;
  $("recZor").textContent = r.zor;
}

function scoreText() {
  return state.champion ? "MAX" : String(state.score);
}

function startGame() {
  const name = $("nameInput").value.trim();
  if (!name) return;
  state = {
    name,
    champion: isFikret(name),
    level,
    score: 0,
    lives: START_LIVES + (secretMode ? 1 : 0),
    maxLives: START_LIVES + (secretMode ? 1 : 0),
    streak: 0,
    bestStreak: 0,
    golden: false,
    correct: 0,
    asked: 0,
    deck: [],
    current: null,
    locked: false
  };
  $("greetName").textContent = name;
  showScreen("gameScreen");
  if (state.champion) {
    showChampion(nextQuestion);
  } else {
    nextQuestion();
  }
}

function drawQuestion() {
  // Sorular bitince deste karıştırılıp baştan başlar (sınırsız soru).
  if (state.deck.length === 0) {
    let deck = shuffle(QUESTIONS[state.level]);
    if (state.current && deck[0] === state.current && deck.length > 1) deck.push(deck.shift());
    state.deck = deck;
  }
  return state.deck.shift();
}

function nextQuestion() {
  state.current = drawQuestion();
  state.asked++;
  state.locked = false;
  const [category, text, options] = state.current;
  const correctText = options[0];

  $("qNum").textContent = state.asked;
  $("score").textContent = scoreText();
  $("lives").textContent = "❤️".repeat(state.lives) + "🤍".repeat(state.maxLives - state.lives);
  $("category").textContent = category;
  $("question").textContent = text;
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  // Sürpriz: ilk sorudan sonra her soru %12 ihtimalle ALTIN soru olur (x3 puan).
  state.golden = state.asked > 1 && Math.random() < 0.12;
  $("gameScreen").classList.toggle("golden", state.golden);
  if (state.golden) { sfx.golden(); showToast("✨ ALTIN SORU! Bu soru 3 kat puan!", true); }
  renderStreak(false);

  const box = $("answers");
  box.innerHTML = "";
  shuffle(options).forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "answer";
    b.innerHTML = '<span class="letter">' + "ABCD"[i] + "</span><span></span>";
    b.lastChild.textContent = opt;
    b.dataset.correct = opt === correctText ? "1" : "0";
    b.addEventListener("click", () => answer(b));
    box.appendChild(b);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerId);
  const total = LEVEL_TIME[state.level] * 1000;
  const startedAt = performance.now();
  state.timeLeft = total;
  const fill = $("timerFill");
  const tick = () => {
    state.timeLeft = Math.max(0, total - (performance.now() - startedAt));
    const ratio = state.timeLeft / total;
    fill.style.width = (ratio * 100) + "%";
    fill.className = "timer-fill" + (ratio < 0.25 ? " danger" : ratio < 0.5 ? " warn" : "");
    $("timeLeft").textContent = Math.ceil(state.timeLeft / 1000);
    if (state.timeLeft <= 0) {
      clearInterval(timerId);
      answer(null);
    }
  };
  tick();
  timerId = setInterval(tick, 50);
}

function answer(button) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(timerId);

  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach((b) => {
    b.disabled = true;
    if (b.dataset.correct === "1") b.classList.add("correct");
  });

  const fb = $("feedback");
  if (button && button.dataset.correct === "1") {
    const secondsLeft = Math.ceil(state.timeLeft / 1000);
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const mult = comboMultiplier(state.streak) * (state.golden ? 3 : 1);
    const gained = (100 + secondsLeft * 10) * mult;
    state.score += gained;
    state.correct++;
    fb.textContent = state.champion ? "Doğru! Şampiyonsun!" : "Doğru! +" + gained + " puan" + (mult > 1 ? " (x" + mult + ")" : "");
    fb.className = "feedback good";
    celebrateCorrect(button, secondsLeft);
  } else {
    if (button) button.classList.add("wrong");
    state.lives--;
    loseStreak();
    fb.textContent = button ? "Yanlış cevap!" : "Süre doldu!";
    fb.className = "feedback bad";
  }
  $("score").textContent = scoreText();
  $("lives").textContent = "❤️".repeat(state.lives) + "🤍".repeat(state.maxLives - state.lives);

  setTimeout(() => {
    if (state.lives <= 0) endGame();
    else nextQuestion();
  }, 1400);
}

function endGame() {
  const records = loadRecords();
  let isNew = false;
  // Fikret'in oyunları rekor kaydını değiştirmez.
  if (!state.champion && state.score > records[state.level]) {
    records[state.level] = state.score;
    saveRecords(records);
    isNew = true;
  }
  $("endName").textContent = state.name;
  $("finalScore").textContent = scoreText();
  $("statCorrect").textContent = state.correct;
  $("statTotal").textContent = state.asked;
  $("statBest").textContent = state.champion ? "MAX" : records[state.level];
  $("newRecord").classList.toggle("hidden", !isNew);
  showScreen("endScreen");
  if (state.bestStreak >= 3) showToast("🔥 En uzun serin: " + state.bestStreak + " doğru üst üste!");
  if (isNew) { sfx.fanfare(); burst(window.innerWidth / 2, window.innerHeight / 3, 50); }
  if (state.champion) showChampion();
}

// ---------- Ses efektleri (WebAudio, dosya gerektirmez) ----------
const SOUND_KEY = "bilgiYarismasi.ses";
let soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== "0"; } catch (e) {}
let audioCtx = null;
function tone(freq, start, dur, type, vol) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime + start;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  correct(level) { const base = 523 * Math.pow(1.06, Math.min(level, 10)); tone(base, 0, 0.15, "triangle"); tone(base * 1.5, 0.09, 0.22, "triangle"); },
  wrong() { tone(220, 0, 0.18, "sawtooth", 0.12); tone(160, 0.14, 0.3, "sawtooth", 0.12); },
  combo() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07, 0.18, "square", 0.08)); },
  golden() { [1319, 1568, 2093].forEach((f, i) => tone(f, i * 0.06, 0.35, "sine", 0.12)); },
  fanfare() { [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i * 0.11, 0.2, "triangle", 0.14)); },
  secret() { [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.06, 0.25, "square", 0.07)); }
};
function renderSoundBtn() { $("soundBtn").textContent = soundOn ? "🔊" : "🔇"; }
$("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0"); } catch (e) {}
  renderSoundBtn();
  if (soundOn) tone(880, 0, 0.12, "triangle");
});
renderSoundBtn();

// ---------- Görsel efektler ----------
const SPARK_COLORS = ["#f8b400", "#6a5af9", "#d66efd", "#3fc4ff", "#22c55e", "#ef4444"];
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, count, colors) {
  if (reduceMotion) return;
  const pal = colors || SPARK_COLORS;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "spark";
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 160;
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.background = pal[i % pal.length];
    p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    p.style.setProperty("--dy", Math.sin(ang) * dist + 40 + "px");
    p.style.setProperty("--rot", Math.random() * 720 - 360 + "deg");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}
function shakeScreen() {
  const el = $("gameScreen");
  el.classList.remove("shake");
  void el.offsetWidth; // animasyonu yeniden başlat
  el.classList.add("shake");
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}
$("gameScreen").addEventListener("animationend", (e) => {
  if (e.animationName === "screenShake") $("gameScreen").classList.remove("shake");
});
let toastTimer = null;
function showToast(text, gold) {
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("gold", !!gold);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- Seri (combo) bonusu ----------
function comboMultiplier(streak) {
  if (streak >= 8) return 4;
  if (streak >= 5) return 3;
  if (streak >= 3) return 2;
  return 1;
}
const COMBO_MESSAGES = { 3: "🔥 3'lü seri! Puanlar x2", 5: "⚡ 5'li seri! Puanlar x3", 8: "🚀 8'li seri! DURDURULAMAZSIN! x4" };
function renderStreak(bump) {
  const el = $("streak");
  const s = state.streak;
  el.textContent = s >= 2 ? "🔥".repeat(Math.min(s, 5)) + " " + s + " seri" + (comboMultiplier(s) > 1 ? " · x" + comboMultiplier(s) : "") : "";
  if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function celebrateCorrect(button, secondsLeft) {
  const r = button.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  sfx.correct(state.streak);
  burst(cx, cy, state.golden ? 40 : 16, state.golden ? ["#f8b400", "#ffd54a", "#fff3c4", "#f59e0b"] : null);
  renderStreak(true);
  if (COMBO_MESSAGES[state.streak]) {
    setTimeout(sfx.combo, 150);
    showToast(COMBO_MESSAGES[state.streak]);
    burst(window.innerWidth / 2, window.innerHeight / 3, 40);
  } else if (state.golden) {
    showToast("💰 Altın soruyu bildin!", true);
  } else if (secondsLeft >= LEVEL_TIME[state.level] - 2) {
    showToast("⚡ Şimşek hızı!");
  }
}
function loseStreak() {
  if (state.streak >= 3) showToast("💔 " + state.streak + "'li serin bozuldu!");
  state.streak = 0;
  renderStreak(false);
  sfx.wrong();
  shakeScreen();
}

// ---------- Gizli mod (Konami kodu ya da başlığa 5 dokunuş) ----------
let secretMode = false;
const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
let konamiPos = 0;
function unlockSecret() {
  if (secretMode) return;
  secretMode = true;
  document.body.classList.add("rainbow");
  $("secretBadge").classList.remove("hidden");
  sfx.secret();
  showToast("🌈 GİZLİ MOD! Ekstra can kazandın!", true);
  burst(window.innerWidth / 2, window.innerHeight / 2, 80);
}
document.addEventListener("keydown", (e) => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  konamiPos = key === KONAMI[konamiPos] ? konamiPos + 1 : (key === KONAMI[0] ? 1 : 0);
  if (konamiPos === KONAMI.length) { konamiPos = 0; unlockSecret(); }
});
let titleTaps = 0, titleTapTimer = null;
document.querySelector("#startScreen h1").addEventListener("click", () => {
  titleTaps++;
  clearTimeout(titleTapTimer);
  titleTapTimer = setTimeout(() => { titleTaps = 0; }, 1500);
  if (titleTaps >= 5) { titleTaps = 0; unlockSecret(); }
});

renderRecords();
</script>
